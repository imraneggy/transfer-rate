# Scrape AED -> INR rates and publish them to GitHub Pages.
#
# This single workflow does:
#   1. Run scrapers/run_all.py to write public/rates.json.
#   2. Commit the JSON to main (so we get free git history of every rate).
#   3. Upload public/ as a Pages artifact.
#   4. Deploy to GitHub Pages.
#
# Why one workflow instead of two:
#   GitHub Actions' GITHUB_TOKEN deliberately does NOT trigger downstream
#   workflows when it commits — to prevent accidental loops. Splitting
#   "scrape" and "pages" into separate workflows therefore breaks the
#   chain: the bot's commit never triggers pages.yml. Combining them in
#   one run sidesteps this entirely.
#
# Security hardening:
#   * Top-level `permissions: {}` denies everything by default.
#   * Job-scoped `permissions:` grants the minimum needed for each step.
#   * Third-party actions are pinned by full commit SHA.
#   * No external secrets referenced — public data only.
#   * `concurrency.cancel-in-progress: true` prevents two runs racing.
name: scrape

on:
  schedule:
    # Multiple cron entries to spread the request across GitHub's scheduling
    # window. Free-tier de-prioritisation is load-based, not per-cron, so this
    # is a small redundancy — for true 15-min cadence, an external pinger
    # (cron-job.org or similar) hits workflow_dispatch directly. See
    # docs/RUNBOOK.md "Reliable 15-minute refresh".
    - cron: "0,15,30,45 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scrapers/**"
      - ".github/workflows/scrape.yml"

permissions: {}

concurrency:
  group: scrape-and-publish
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-24.04
    # Bumped from 5 to 8 minutes to accommodate the headless-Chromium
    # path used for LuLu (~10 s once Chromium is cached, longer the
    # first time).
    timeout-minutes: 8
    permissions:
      contents: write   # commit rates.json
      pages: write      # deploy to Pages
      id-token: write   # OIDC token used by deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Cache the Playwright browser binaries so we only download
      # Chromium (~150 MB) once across runs. The cache key includes
      # the Playwright pin so a version bump invalidates correctly.
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: python -m playwright install chromium --with-deps

      - name: Run scrapers
        run: python -m scrapers.run_all --out public/rates.json
        env:
          PYTHONUNBUFFERED: "1"
          # LuLu strategy (run_all picks the first that's set):
          #   1. LULU_PROXY_URL (Cloudflare Worker, see
          #      infra/lulu-proxy/) — required for CI to reach LuLu.
          #
          # The headless-Chromium fallback (LULU_USE_BROWSER) is
          # intentionally NOT set: although Playwright works
          # locally, in CI the in-page JS still calls the same
          # port-9443 endpoint that the GHA datacenter firewall
          # blocks — so the rate placeholder never updates and
          # wait_for_function times out. The browser is a UI for
          # the same blocked HTTP call. Only a real proxy on a
          # different network path (Cloudflare Worker, residential
          # proxy) actually fixes this.
          LULU_PROXY_URL: ${{ secrets.LULU_PROXY_URL }}

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "transfer-rate-bot"
          git config user.email "transfer-rate-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain public/rates.json)" ]; then
            git add public/rates.json
            git commit -m "rates: scheduled update"
            git push
          else
            echo "no changes"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
