# Scheduled scraper for AED -> INR rates.
#
# Runs every 15 minutes, executes scrapers/run_all.py, commits the resulting
# public/rates.json. The committed file is what the Android app fetches.
#
# Security hardening:
#   * Top-level `permissions: {}` denies everything by default. We grant the
#     `contents: write` permission ONLY to the commit step.
#   * Third-party actions are pinned by full commit SHA (mutable tags can be
#     re-pointed by attackers; SHAs are immutable).
#   * No secrets are referenced — this workflow needs none. Public data only.
#   * `concurrency.cancel-in-progress: true` prevents two runs racing.
name: scrape

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes UTC
  workflow_dispatch: {}       # allow manual trigger from the Actions tab
  push:
    branches: [main]
    paths:
      - "scrapers/**"
      - ".github/workflows/scrape.yml"

permissions: {}

concurrency:
  group: scrape
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write   # only this job can write — minimum needed to commit
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.txt 2>/dev/null || \
            pip install -r requirements.txt

      - name: Run scrapers
        run: python -m scrapers.run_all --out public/rates.json
        env:
          PYTHONUNBUFFERED: "1"

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "transfer-rate-bot"
          git config user.email "transfer-rate-bot@users.noreply.github.com"
          if [ -n "$(git status --porcelain public/rates.json)" ]; then
            git add public/rates.json
            # Intentionally NO [skip ci] tag here.
            # scrape.yml's `paths: scrapers/**` filter prevents this commit
            # from re-triggering scrape (the diff is in public/), and pages.yml
            # specifically wants this push event to fire so it can republish.
            git commit -m "rates: scheduled update"
            git push
          else
            echo "no changes"
          fi
