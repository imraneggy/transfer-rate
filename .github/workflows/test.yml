# Run pytest on every push and pull request that touches scraper or test
# code. This is the safety net: when a provider's response shape changes,
# the test fails and we know to update the scraper before the cron silently
# starts producing wrong rates.
name: test

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scrapers/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "scrapers/**"
      - "tests/**"
      - "requirements*.txt"

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short
        env:
          PYTHONUNBUFFERED: "1"
