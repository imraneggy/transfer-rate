# Build the release APK on a tag push or manual dispatch.
# Uses repo secrets KEYSTORE_BASE64 + KEYSTORE_* if configured; otherwise
# falls back to debug-signed APK (per build.gradle.kts).
name: android-build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.9.0)"
        required: false

# Default-deny at workflow level; the `build` job grants `contents: write`
# only because the final softprops/action-gh-release step needs it to
# create the GitHub Release.  Other steps (checkout, setup-java, gradle
# build, upload-artifact) run with no token write permission.
permissions: {}

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write   # required by softprops/action-gh-release
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 17
        uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b # v4.6.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@06832c7b30a0129d7fb559bcc6e43d26f6374244 # v4.3.1
        with:
          gradle-version: "8.11.1"

      - name: Decode keystore (if provided)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/secrets
          echo "$KEYSTORE_BASE64" | base64 -d > android/secrets/release.jks
          echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/android/secrets/release.jks" >> $GITHUB_ENV

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          gradle assembleRelease --no-daemon --stacktrace

      - name: Locate APKs
        id: locate
        run: |
          cd android/app/build/outputs/apk/release
          ls -la
          echo "apks=$(ls *.apk | tr '\n' ',' | sed 's/,$//')" >> $GITHUB_OUTPUT

      - name: Upload APK artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: transfer-rate-apks
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
