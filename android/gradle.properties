# JVM args for the Gradle daemon. -Xmx2g is enough for a single-module app.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# Parallel & caching speed up incremental builds significantly.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is the modern support library lineage; required for Compose.
android.useAndroidX=true

# R8 full-mode = stricter, smaller, more security-relevant bytecode shrinking.
android.enableR8.fullMode=true

# Kotlin code style for code-format tools.
kotlin.code.style=official

# Don't include unused resources in release builds.
android.nonTransitiveRClass=true
android.nonFinalResIds=true
